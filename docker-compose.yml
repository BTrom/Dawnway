version: '3.8'
services:

  # 1. Frontend
  dawnway:
    image: nginx:alpine
    container_name: dawnway_nginx
    ports:
      - "8082:80" # We're forwarding port 8082 on the host to port 80 in the container because the global install of the server is already serving a different website
    volumes:
      - .:/usr/share/nginx/html:ro 
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    restart: unless-stopped
    depends_on:
      - backend



  # 2. Socket.IO / Node.js Backend
  backend:
    image: node:18-alpine
    container_name: dawnway_backend
    working_dir: /app
    # Maps a local 'backend' folder to the container to edit code live
    volumes:
      - ./backend:/app 
    ports:
      - "3000:3000" # Exposing the Socket.IO backend
    command: sh -c "npm install && npm run dev"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/dawnway_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    restart: unless-stopped
    depends_on:
      - mongodb
      - redis



  # 3. MongoDB Database
  mongodb:
    image: mongo:latest
    container_name: dawnway_mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      # We use a named volume here so the database isn't wiped when the container stops
      - mongo-data:/data/db
    restart: unless-stopped



  # 4. Redis Cache
  redis:
    image: redis:alpine
    container_name: dawnway_redis
    # ports:
    #   - "6379:6379"
    restart: unless-stopped



  # 5. Cloudflare Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: dawnway_tunnel
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - dawnway


# Declaring the named volume for persistent database storage
volumes:
  mongo-data: