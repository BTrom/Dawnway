events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        
        # 1. Serve the frontend HTML/JS/CSS
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            # This helps with Single Page Applications (like React/Vue) routing
            try_files $uri $uri/ /index.html; 
        }

        # 2. Proxy WebSockets to the Node.js backend
        location /socket.io/ {
            proxy_pass http://backend:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            
            # Forward the real IP so the backend knows who is connecting
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. Proxy /api requests to the Node.js backend
        location /api/ {
            proxy_pass http://backend:3000; # Matches the container_name in docker-compose
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }
    }
}
