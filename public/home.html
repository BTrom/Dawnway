        fetch('/api/me')
            .then(response => {
                if (!response.ok) throw new Error("Not logged in");
                return response.json();
            })
            .then(data => {
                if (data.authenticated) {
                    
                    // Function to safely inject the username
                    const updateUsername = () => {
                        const navName = document.getElementById('nav-username');
                        if (navName) navName.textContent = data.username;
                    };

                    // If the HTML is still parsing, wait for it. Otherwise, run immediately!
                    if (document.readyState === 'loading') {
                        document.addEventListener('DOMContentLoaded', updateUsername);
                    } else {
                        updateUsername(); 
                    }

                } else {
                    window.location.href = '/index.html'; 
                }
            })
            .catch(() => {
                window.location.href = '/index.html';
            });

<script src="JS/nebula.js"></script>
<script>
    // --- SIMULATION TIME CALCULATOR ---
    function formatSimulationTime(tick) {
        tick = parseInt(tick) || 0;
        // 1 tick = 10 minutes
        const totalMinutes = tick * 10;
        const minutes = totalMinutes % 60;
        const totalHours = Math.floor(totalMinutes / 60);
        const hours = totalHours % 24;
        
        // Custom Calendar: 30 days/month, 12 months/year
        const totalDays = Math.floor(totalHours / 24);
        const day = (totalDays % 30) + 1; // +1 because days start at 1, not 0
        const totalMonths = Math.floor(totalDays / 30);
        const month = (totalMonths % 12) + 1; // +1 because months start at 1
        const year = Math.floor(totalMonths / 12) + 1; // Year 1 starts at tick 0

        // Format strings with leading zeros (e.g., 05 instead of 5)
        const hh = String(hours).padStart(2, '0');
        const mm = String(minutes).padStart(2, '0');
        const DD = String(day).padStart(2, '0');
        const MM = String(month).padStart(2, '0');
        const YYYY = String(year).padStart(4, '0');

        return {
            timeString: `${hh}:${mm}`,
            dateString: `${DD}/${MM}/${YYYY}`
        };
    }
    
    // --- CONNECT TO WEBSOCKET ---
    const socket = io();

    socket.on('sim_update', (data) => {
        // Run the math on the incoming tick
        const simCalendar = formatSimulationTime(data.tick);

        const tickEl = document.getElementById('display-tick');
        const timeEl = document.getElementById('display-time');
        const dateEl = document.getElementById('display-date');

        if (tickEl) tickEl.textContent = data.tick;
        if (timeEl) timeEl.textContent = simCalendar.timeString;
        if (dateEl) dateEl.textContent = simCalendar.dateString;

        // Update Admin Tick input (only if they aren't actively typing in it)
        if (document.getElementById('input-set-tick') && !isTickInputFocused) {
            document.getElementById('input-set-tick').value = data.tick;
        }
    });

    // Listen for live need/emotion changes
    socket.on('agent_update', (data) => {
        // Only update the UI if the data belongs to the agent we are currently watching
        if (data.agentId === activeAgentId) {
            
            // FIXED: Using the correct ID for your HTML structure!
            const needsContainer = document.getElementById('needs-container'); 
            
            if (needsContainer) {
                needsContainer.innerHTML = ''; 
                for (const [key, value] of Object.entries(data.needs)) {
                    const safeValue = Math.max(0, Math.min(100, value));
                    const urgency = data.urgencies[key] || 0;
                    const priority = data.priorities && data.priorities[key] !== undefined ? data.priorities[key] : 1;
                    
                    // Dynamic colors based on your thresholds
                    let color = 'rgba(74, 222, 128, 1)'; // Green
                    let glow = 'rgba(74, 222, 128, 0.4)';
                    if (safeValue < 60) { color = 'rgba(251, 191, 36, 1)'; glow = 'rgba(251, 191, 36, 0.4)'; }
                    if (safeValue < 30) { color = 'rgba(248, 113, 113, 1)'; glow = 'rgba(248, 113, 113, 0.4)'; }

                    // Apply your math for the 1px bar
                    const urgencyWidth = urgency * 100;
                    const urgencyOpacity = 0.5 + (urgency * 0.5);
                    const finalUrgency = urgency * priority;

                    // FIXED: Restored your custom CSS classes (need-row, need-bar-bg, etc.)
                    needsContainer.innerHTML += `
                        <div class="need-row">
                            <div class="need-header">
                                <span>${key}</span>
                                <span>${Math.round(safeValue)}%</span>
                            </div>
                            <div class="need-bar-bg">
                                <div class="need-bar-fill" style="width: ${safeValue}%; background-color: ${color}; box-shadow: 0 0 10px ${glow};"></div>
                            </div>
                            <div style="display: flex; align-items: center; opacity: ${urgencyOpacity}; margin-top: -0.25rem;">
                                <div style="flex-grow: 1; margin-right: 10px; height: 1px; background-color: rgba(0,0,0,0.35);">
                                    <div style="width: ${urgencyWidth}%; height: 1px; background-color: #ff6464;"></div>
                                </div>
                                <div style="width: 70px; text-align: right; font-family: monospace; font-size: 0.65rem; color: #ffffff; letter-spacing: 0.5px; opacity: ${urgencyOpacity};">
                                    ${priority.toFixed(1)}x : ${finalUrgency.toFixed(2)}
                                </div>
                            </div>
                        </div>
                    `;
                }
            }
        }
    });

    // Listen for new actions/milestones
    socket.on('new_event_log', (log) => {
        if (log.agent === activeAgentId) {
            const logsContainer = document.getElementById('event-log-container');
            if (logsContainer) {
                const time = new Date(log.timestamp).toLocaleTimeString([], { hour12: false });
                let iconSvg = '';
                let borderColor = 'rgba(255, 255, 255, 0.2)';
                
                // Copy your exact switch(log.event_category) block here from fetchAgentDetails
                switch(log.event_category) {
                    case 'action':
                        borderColor = '#60a5fa'; 
                        iconSvg = `<svg viewBox="0 0 24 24"><path fill="${borderColor}" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`;
                        break;
                    // ... include your other cases (milestone, death, etc.)
                }

                const newLogHtml = `
                    <div class="log-entry" style="border-left-color: ${borderColor}">
                        <div class="log-icon">${iconSvg}</div>
                        <span class="log-time">[${time}]</span>
                        <span class="log-desc">${log.description}</span>
                    </div>
                `;
                
                // Use insertAdjacentHTML to push the new log to the TOP of the list
                logsContainer.insertAdjacentHTML('afterbegin', newLogHtml);
            }
        }
    });

    socket.on('bulk_agents_added', () => {
        loadUserAgents(); // Refresh the list automatically!
    });

    socket.on('bulk_agents_removed', () => {
        loadUserAgents(); 
        document.getElementById('main-display').style.display = 'none'; // Hide the display in case the active agent was deleted
    });

    // Global state trackers for the UI
    let isPaused = false;
    let isTickInputFocused = false;

    fetch('/api/me')
        .then(response => {
            if (!response.ok) throw new Error("Not logged in");
            return response.json();
        })
        .then(data => {
            if (data.authenticated) {
                const userElement = document.getElementById('nav-username');
                if (userElement) userElement.textContent = data.username;
                
                if (data.admin_privileges) {
                    document.getElementById('admin-panel').style.display = 'flex';
                    
                    isPaused = data.simPaused;
                    updatePlayPauseIcon();
                    document.getElementById('input-set-tick').value = data.simTick;
                    document.getElementById('input-set-speed').value = data.currentInterval;

                    initAdminPanel();
                }
                
                loadUserAgents();
            } else {
                window.location.href = '/index.html'; 
            }
        })
        .catch(() => {
            window.location.href = '/index.html';
        });

    

    // Admin Panel Functions
    function initAdminPanel() {
        const panel = document.getElementById('admin-panel');
        const toggleBtn = document.getElementById('admin-toggle');
        const playPauseBtn = document.getElementById('btn-play-pause');
        const tickInput = document.getElementById('input-set-tick');
        const speedInput = document.getElementById('input-set-speed');
        const fastForwardInput = document.getElementById('input-fast-forward');
        const bulkCreateInput = document.getElementById('input-bulk-create');
        const bulkDeleteBtn = document.getElementById('btn-bulk-delete');

        // 1. Toggle Slide
        toggleBtn.addEventListener('click', () => panel.classList.toggle('open'));

        // Track if user is typing so we don't overwrite their input with Socket data
        tickInput.addEventListener('focus', () => isTickInputFocused = true);
        tickInput.addEventListener('blur', () => isTickInputFocused = false);

        // 2. Play / Pause
        playPauseBtn.addEventListener('click', async () => {
            const action = isPaused ? 'resume' : 'pause';
            await sendAdminCommand(action);
            isPaused = !isPaused;
            updatePlayPauseIcon();
        });

        // 3. Set Tick (Enter key)
        tickInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(tickInput.value);
                if (!isNaN(val)) {
                    await sendAdminCommand('set_tick', val);
                    tickInput.blur(); // Remove focus after submit
                }
            }
        });

        // 4. Set Speed (Enter key)
        speedInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(speedInput.value);
                if (!isNaN(val)) {
                    await sendAdminCommand('set_speed', val);
                    speedInput.blur();
                }
            }
        });

        // 5. Fast Forward (Enter key)
        fastForwardInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(fastForwardInput.value);
                if (!isNaN(val)) {
                    await sendAdminCommand('fast_forward', val);
                    fastForwardInput.blur();
                }
            }
        });

        // 6. Bulk Create (Enter key)
        bulkCreateInput.addEventListener('keydown', async (e) => {
            if (e.key === 'Enter') {
                const val = parseInt(bulkCreateInput.value);
                if (!isNaN(val)) {
                    await generateBulkAgents(val);
                    bulkCreateInput.blur();
                }
            }
        });

        // 7. Bulk Delete
        bulkDeleteBtn.addEventListener('click', async () => {
            await cleanBulkAgents();
        });
    }

    async function sendAdminCommand(action, value = null) {
        try {
            const payload = { action };
            if (value !== null) payload.value = value;

            await fetch('/api/sim/control', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
        } catch (err) {
            console.error("Admin command failed", err);
        }
    }

    function updatePlayPauseIcon() {
        document.getElementById('icon-play').style.display = isPaused ? 'block' : 'none';
        document.getElementById('icon-pause').style.display = isPaused ? 'none' : 'block';
    }

    async function generateBulkAgents(amount) {
        const inputEl = document.getElementById('input-bulk-create');
        inputEl.disabled = true;

        try {
            const res = await fetch('/api/agents/bulk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ amount })
            });
            const data = await res.json();
            
            if (data.success) {
                console.log(data.message); // Success! Socket will handle the UI refresh.
                inputEl.value = ''; // Clear the input
            } else {
                alert("Error: " + data.message);
            }
        } catch(e) {
            console.error("Error generating agents:", e);
        }
        
        inputEl.disabled = false; // Re-enable
    }

    async function cleanBulkAgents() {
        if (!confirm("Are you sure? This will permanently delete all bulk-generated agents and their logs.")) return;
        
        try {
            const res = await fetch('/api/agents/bulk', { method: 'DELETE' });
            const data = await res.json();
            
            if (data.success) {
                console.log(data.message);
            }
        } catch(e) {
            console.error("Error cleaning up:", e);
        }
    }



    // --- NEW FUNCTION TO LOAD AGENTS ---
    async function loadUserAgents() {
        try {
            const response = await fetch('/api/agents');
            const result = await response.json();
            
            if (result.success) {
                const characterList = document.getElementById('characters');
                characterList.innerHTML = ''; // Clear out any existing placeholder items
                
                if (result.agents.length === 0) {
                    return;
                }

                // Loop through agents and build the cards
                result.agents.forEach((agent, index) => {
                    const li = document.createElement('li');
                    const isActive = index === 0 ? 'active' : ''; 
                    const charId = `ID-${String(index + 1).padStart(2, '0')}`;
                    
                    li.className = `agent-card ${isActive}`;
                    // ADD THIS ONCLICK:
                    li.onclick = () => selectAgent(agent._id, li, charId);
                    
                    li.innerHTML = `
                        <div class="agent-card-header">
                            <span class="agent-id">${charId}</span>
                            <span class="agent-pulse"></span>
                        </div>
                        <h3 class="agent-name">${agent.name} ${agent.surname}</h3>
                        <p class="agent-class">${agent.gender} / ${agent.age}</p>
                    `;
                    
                    characterList.appendChild(li);

                    // Auto-load the first agent on page load
                    if (index === 0) selectAgent(agent._id, li, charId);

                    // Make the card clickable
                    li.addEventListener('click', () => {
                        // Visually change active state
                        document.querySelectorAll('.agent-card').forEach(c => c.classList.remove('active'));
                        li.classList.add('active');
                        
                        // Fetch and display this specific agent
                        fetchAgentDetails(agent._id);
                    });

                    characterList.appendChild(li);

                    // Automatically load the first agent's details when the page loads
                    if (index === 0) {
                        fetchAgentDetails(agent._id);
                    }
                });
            }
        } catch (error) {
            console.error("Failed to load agents:", error);
        }
    }

    let activeAgentId = null;
    
    async function fetchAgentDetails(agentId) {
        try {
            const response = await fetch(`/api/agents/${agentId}`);
            const result = await response.json();
            const logsContainer = document.getElementById('event-log-container');
            logsContainer.innerHTML = '';
            activeAgentId = agentId;

            const defaultNeeds = { hunger: 100, thirst: 100, bladder: 100, sleep: 100, hygiene: 100 , health: 100 };
            const defaultEmotions = { joy: 50, sadness: 50, anger: 50, fear: 50 };

            if (result.success) {
                // Un-hide the main display
                document.getElementById('main-display').style.display = 'flex';
                
                // 1. Populate Identity
                document.getElementById('display-name').textContent = `${result.agent.name} ${result.agent.surname}`;
                document.getElementById('display-gender').textContent = result.agent.gender;
                
                // Format age (Assuming age is stored as a number)
                document.getElementById('display-age').textContent = `${result.agent.age}`;

                // 2. Populate Snapshot / Sim Data
                const tick = (result.snapshot && result.snapshot.tick) ? parseInt(result.snapshot.tick) || 0 : 0;
                
                // Generate the historical time/date purely from the snapshot's tick!
                const historyCalendar = formatSimulationTime(tick);

                document.getElementById('display-tick').textContent = tick;
                document.getElementById('display-time').textContent = historyCalendar.timeString;
                document.getElementById('display-date').textContent = historyCalendar.dateString;

                const needs = (result.snapshot && result.snapshot.needs) ? result.snapshot.needs : defaultNeeds;
                const emotions = (result.snapshot && result.snapshot.emotions) ? result.snapshot.emotions : defaultEmotions;

                // Render Needs (Horizontal)
                const needsContainer = document.getElementById('needs-container');
                needsContainer.innerHTML = ''; // Clear previous
                const urgencies = result.urgencies || {};
                const priorities = result.priorities || {};
                
                for (const [key, value] of Object.entries(needs)) {
                    // Determine color based on percentage
                    let color = 'rgba(74, 222, 128, 1)'; // Green (Optimal)
                    let glow = 'rgba(74, 222, 128, 0.4)';
                    
                    if (value < 60) {
                        color = 'rgba(251, 191, 36, 1)'; // Yellow (Warning)
                        glow = 'rgba(251, 191, 36, 0.4)';
                    }
                    if (value < 30) {
                        color = 'rgba(248, 113, 113, 1)'; // Red (Critical)
                        glow = 'rgba(248, 113, 113, 0.4)';
                    }

                    const safeValue = Math.max(0, Math.min(100, value));
                    const urgency = urgencies[key] || 0;
                    const priority = priorities[key] !== undefined ? priorities[key] : 1;

                    const urgencyWidth = urgency * 100;
                    const urgencyOpacity = 0.5 + (urgency * 0.5);
                    const finalUrgency = urgency * priority;
                    
                    needsContainer.innerHTML += `
                        <div class="need-row">
                            <div class="need-header">
                                <span>${key}</span>
                                <span>${Math.round(value)}%</span>
                            </div>
                            <div class="need-bar-bg">
                                <div class="need-bar-fill" style="width: ${value}%; background-color: ${color}; box-shadow: 0 0 10px ${glow};"></div>
                            </div>
                            <div style="display: flex; align-items: center; opacity: ${urgencyOpacity}; margin-top: -0.25rem;">
                                <div style="flex-grow: 1; margin-right: 10px; height: 1px; background-color: rgba(0,0,0,0.35);">
                                    <div style="width: ${urgencyWidth}%; height: 1px; background-color: #ff6464;"></div>
                                </div>
                                <div style="width: 70px; text-align: right; font-family: monospace; font-size: 0.65rem; color: #ffffff; letter-spacing: 0.5px; opacity: ${urgencyOpacity};">
                                    ${priority.toFixed(1)}x : ${finalUrgency.toFixed(2)}
                                </div>
                            </div>
                        </div>
                    `;
                }

                // Render Emotions (Vertical)
                const emotionsContainer = document.getElementById('emotions-container');
                emotionsContainer.innerHTML = ''; // Clear previous

                for (const [key, value] of Object.entries(emotions)) {
                    emotionsContainer.innerHTML += `
                        <div class="emotion-col">
                            <span class="emotion-label">${key}</span>
                            <div class="emotion-bar-bg">
                                <div class="emotion-bar-fill" style="height: ${value}%;"></div>
                            </div>
                        </div>
                    `;
                }

                // --- 4. POPULATE EVENT LOGS ---
                if (result.logs && result.logs.length > 0) {
                    result.logs.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
                    result.logs.forEach(log => {
                        // Extract just the time (e.g., "14:32:05")
                        // const time = new Date(log.timestamp).toLocaleTimeString([], { hour12: false });
                        
                        let iconSvg = '';
                        let borderColor = 'rgba(255, 255, 255, 0.2)';
                        
                        // Assign colors and specific SVG icons based on the event_category enum
                        switch(log.event_category) {
                            case 'action':
                                borderColor = '#60a5fa'; // Blue
                                iconSvg = `<svg viewBox="0 0 24 24"><path fill="${borderColor}" d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>`; // Lightning bolt
                                break;
                            case 'milestone':
                                borderColor = '#c084fc'; // Purple
                                iconSvg = `<svg viewBox="0 0 24 24"><path fill="${borderColor}" d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`; // Star
                                break;
                            case 'learning':
                                borderColor = '#34d399'; // Green
                                iconSvg = `<svg viewBox="0 0 24 24"><path fill="${borderColor}" d="M12 2L2 12l10 10 10-10L12 2z"/></svg>`; // Diamond / Data node
                                break;
                            case 'death':
                                borderColor = '#f87171'; // Red
                                iconSvg = `<svg viewBox="0 0 24 24"><path fill="${borderColor}" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>`; // Warning circle
                                break;
                            default:
                                iconSvg = `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6" fill="#fff"/></svg>`; // Generic dot
                        }
                        
                        logsContainer.innerHTML += `
                            <div class="log-entry" style="border-left-color: ${borderColor}">
                                <div class="log-icon">${iconSvg}</div>
                                <span class="log-desc">${log.description}</span>
                            </div>
                        `;
                        
                        // logsContainer.innerHTML += `
                        //     <div class="log-entry" style="border-left-color: ${borderColor}">
                        //         <div class="log-icon">${iconSvg}</div>
                        //         <span class="log-time">[${time}]</span>
                        //         <span class="log-desc">${log.description}</span>
                        //     </div>
                        // `;
                    });
                } else {
                    // Empty state
                    logsContainer.innerHTML = '<div style="color: rgba(255, 255, 255, 0.3); text-align: center; padding: 2rem; font-family: \'Courier Prime\', monospace; letter-spacing: 2px;">NO LOG DATA AVAILABLE</div>';
                }
            }
        } catch (error) {
            console.error("Failed to load agent details:", error);
        }
    }

    async function selectAgent(agentId, cardElement, subIdStr) {
        // 1. Update active styling in the sidebar
        document.querySelectorAll('.agent-card').forEach(card => card.classList.remove('active'));
        if (cardElement) cardElement.classList.add('active');

        try {
            // 2. Fetch the data
            const response = await fetch(`/api/agents/${agentId}`);
            const result = await response.json();

            if (result.success) {
                const a = result.agent;
                const snap = result.snapshot;
                
                // 3. Populate basic text
                document.getElementById('panel-agent-name').textContent = `${a.name} ${a.surname}`;
                document.getElementById('panel-agent-id').textContent = subIdStr;
                document.getElementById('panel-agent-gender').textContent = a.gender;
                document.getElementById('panel-agent-age').textContent = `${a.age} CYCLES`;

                // 4. Populate Needs Bars
                // If the agent doesn't have a snapshot yet, we default to 100%
                const needs = snap && snap.needs ? snap.needs : { Energy: 100, Hunger: 100, Hydration: 100, Fun: 100 };
                const needsContainer = document.getElementById('panel-agent-needs');
                needsContainer.innerHTML = ''; // Clear old bars

                for (const [needName, needValue] of Object.entries(needs)) {
                    // Cap value between 0 and 100 for the width percentage
                    const safeValue = Math.max(0, Math.min(100, needValue)); 
                    
                    needsContainer.innerHTML += `
                        <div>
                            <div class="flex justify-between font-label-mono text-xs mb-1">
                                <span class="text-neutral-400 uppercase tracking-widest">${needName}</span>
                                <span class="text-white">${safeValue}%</span>
                            </div>
                            <div class="need-bar-container">
                                <div class="need-bar-fill" style="width: ${safeValue}%;"></div>
                            </div>
                        </div>
                    `;
                }

                // 5. Fade the panel in smoothly
                document.getElementById('agent-data-panel').style.opacity = '1';
            }
        } catch (error) {
            console.error("Failed to load agent details:", error);
        }
    }
</script>
</html>
